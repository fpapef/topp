name: APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Outils Android
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.1.0" > /dev/null

      - name: Clé de signature
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > topp.jks
            PASS="$KEYSTORE_PASSWORD"
          else
            echo "::warning::Aucune clé dans les secrets : clé temporaire, ces APK ne s'installeront pas par-dessus les versions publiées."
            PASS=temporaire
            keytool -genkeypair -keystore topp.jks -alias topp -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PASS" -keypass "$PASS" -dname "CN=Topp"
          fi
          printf "storePassword=%s\nkeyPassword=%s\nkeyAlias=topp\nstoreFile=../topp.jks\n" "$PASS" "$PASS" > keystore.properties

      - name: Tests du protocole et des gestes
        run: >
          ./gradlew --no-daemon
          :mobile:testDebugUnitTest --tests 'com.fpapef.topp.HohemTest'
          :wear:testDebugUnitTest --tests 'com.fpapef.topp.wear.GestureTest'

      - name: Compilation des APK
        run: ./gradlew --no-daemon :mobile:assembleRelease :wear:assembleRelease

      - name: Nommer les fichiers
        run: |
          V=$(grep -m1 'versionName' mobile/build.gradle.kts | sed -E 's/.*"(.*)".*/\1/')
          mkdir -p out
          cp mobile/build/outputs/apk/release/mobile-release.apk "out/Topp-telephone-$V.apk"
          cp wear/build/outputs/apk/release/wear-release.apk "out/Topp-montre-$V.apk"
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: topp-apk
          path: out/*.apk

      - name: Publier la version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$GITHUB_REF_NAME"
          NOTES="docs/notes/$TAG.md"
          [ -f "$NOTES" ] || NOTES=/dev/null
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" out/*.apk --clobber
          else
            gh release create "$TAG" out/*.apk --title "Topp ${TAG#v}" --notes-file "$NOTES"
          fi
